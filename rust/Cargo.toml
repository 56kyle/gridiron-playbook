[workspace]
members = ["core", "python", "wasm"]
default-members = ["core", "wasm"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gridiron-playbook-core = { path = "core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }
uesave = "0.7.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
